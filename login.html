<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Charms - Login</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    background: linear-gradient(135deg, #fff1f7 0%, #f8e8f0 100%);
    font-family: "Times New Roman", Arial, sans-serif;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-container {
    background: white;
    border-radius: 20px;
    max-width: 450px;
    width: 100%;
    padding: 50px 40px;
}

.login-header {
    text-align: center;
    margin-bottom: 40px;
}

.logo-text {
    font-size: 32px;
    font-weight: bold;
    color: #3d0026;
    font-family: "Times New Roman";
    margin-bottom: 10px;
}

.tagline {
    font-size: 14px;
    color: #d63384;
    font-style: italic;
}

.login-title {
    font-size: 24px;
    font-weight: 600;
    color: #3d0026;
    margin-top: 30px;
    margin-bottom: 10px;
}


.form-group {
    margin-bottom: 20px;
    position: relative;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #3d0026;
    margin-bottom: 8px;
    font-family: "Times New Roman";
}

input[type="email"],
input[type="tel"],
input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 14px;
    border: 1px solid #3d0026;
    border-radius: 10px;
    font-size: 14px;
    font-family: "Times New Roman";
    transition: 0.3s;
}

input:focus {
    outline: none;
    border-color: #d63384;
    box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.1);
}

.password-container {
    position: relative;
}

.password-container input {
    padding-right: 60px;
}

.password-eye {
    position: absolute;
    right: 12px;
    top: 30%;
    cursor: pointer;
    font-size: 13px;
    color: #999;
    font-family: "Times New Roman";
    user-select: none;
}

.password-eye:hover {
    color: #d63384;
}

.form-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.form-tab {
    flex: 1;
    padding: 12px;
    border: 2px solid #3d0026;
    background: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
    color: #999;
    text-align: center;
    transition: 0.3s;
    font-family: "Times New Roman";
}

.form-tab.active {
    border-color: #3d0026;
    color: #3d0026;
    background: #ffe6f5;
}

.input-group { display: none; }
.input-group.active { display: block; }

.login-btn {
    width: 100%;
    padding: 14px;
    background: #3d0026;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    font-family: "Times New Roman";
    cursor: pointer;
    margin-top: 20px;
}

.login-btn:hover {
    background: #b62a70;
}

.login-btn:disabled {
    background: #e999c0;
    cursor: not-allowed;
    transform: none;
}

.error-message, .success-message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
}

.error-message {
    background: #f8d7da;
    color: #721c24;
}

.success-message {
    background: #d4edda;
    color: #155724;
}

.show { display: block; }



.signup-link {
    text-align: center;
    margin-top: 25px;
    font-size: 14px;
}

.signup-link a {
    color: #d63384;
    text-decoration: none;
    font-weight: 600;
}

.signup-link a:hover { text-decoration: underline; }

@media (max-width: 1024px) {
    .login-container { padding: 45px 35px; max-width: 400px; }
    .logo-text { font-size: clamp(1.125rem, 1.75vw, 1.75rem); }
    .login-title { font-size: clamp(1rem, 1.375vw, 1.375rem); }
}

@media (max-width: 768px) {
    body { padding: clamp(20px, 4vw, 26px); }
    .login-container { padding: 40px 30px; max-width: 100%; border-radius: 16px; }
    .logo-text { font-size: clamp(1.125rem, 1.5vw, 1.5rem); margin-bottom: 8px; }
    .tagline { font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); }
    .login-title { font-size: clamp(1rem, 1.25vw, 1.25rem); margin-top: 25px; }
    .login-subtitle { font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; }
    label { font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); margin-bottom: 6px; }
    input[type="email"],
    input[type="tel"],
    input[type="text"],
    input[type="password"] { padding: 12px; font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); }
    .form-tabs { gap: 8px; margin-bottom: 18px; }
    .form-tab { padding: 10px; font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); }
    .login-btn { padding: 12px; font-size: clamp(0.9375rem, 0.9375vw, 0.9375rem); margin-top: 18px; }
    .remember-checkbox { margin: 12px 0; font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); gap: 6px; }
    input[type="checkbox"] { width: 16px; height: 16px; }
    .signup-link { margin-top: 20px; font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); }
    .error-message, .success-message { padding: 10px; font-size: clamp(0.6875rem, 0.8125vw, 0.8125rem); margin-bottom: 18px; }
}

@media (max-width: 600px) {
    body { padding: clamp(18px, 3.5vw, 24px); }
    .login-container { padding: 30px 20px; max-width: 100%; }
    .login-header { margin-bottom: 30px; }
    .logo-text { font-size: clamp(1.125rem, 1.25vw, 1.25rem); margin-bottom: 6px; }
    .tagline { font-size: clamp(0.6875rem, 0.75vw, 0.75rem); }
    .login-title { font-size: clamp(1rem, 1.125vw, 1.125rem); margin-top: 20px; margin-bottom: 8px; }
    .login-subtitle { font-size: clamp(0.6875rem, 0.75vw, 0.75rem); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { font-size: clamp(0.6875rem, 0.75vw, 0.75rem); margin-bottom: 5px; }
    input[type="email"],
    input[type="tel"],
    input[type="text"],
    input[type="password"] { padding: 11px; font-size: clamp(0.6875rem, 0.75vw, 0.75rem); border-radius: 8px; }
    .form-tabs { gap: 6px; margin-bottom: 15px; }
    .form-tab { padding: 9px 8px; font-size: clamp(0.6875rem, 0.75vw, 0.75rem); border-radius: 8px; }
    .login-btn { padding: 11px; font-size: clamp(0.875rem, 0.875vw, 0.875rem); margin-top: 15px; border-radius: 8px; }
    .remember-checkbox { margin: 10px 0; font-size: clamp(0.6875rem, 0.75vw, 0.75rem); gap: 5px; }
    input[type="checkbox"] { width: 15px; height: 15px; }
    .signup-link { margin-top: 18px; font-size: clamp(0.6875rem, 0.75vw, 0.75rem); }
    .error-message, .success-message { padding: 8px; font-size: clamp(0.6875rem, 0.75vw, 0.75rem); margin-bottom: 15px; border-radius: 6px; }
    .password-eye { font-size: clamp(0.6875rem, 0.75vw, 0.75rem); right: 10px; }
}

@media (max-width: 480px) {
    body { padding: 14px; }
    .login-container { padding: 25px 16px; border-radius: 14px; }
    .login-header { margin-bottom: 25px; }
    .logo-text { font-size: clamp(1.125rem, 1.125vw, 1.125rem); margin-bottom: 5px; }
    .tagline { font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); }
    .login-title { font-size: clamp(1rem, 1vw, 1rem); margin-top: 18px; margin-bottom: 6px; }
    .login-subtitle { font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); margin-bottom: 18px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); margin-bottom: 4px; }
    input[type="email"],
    input[type="tel"],
    input[type="text"],
    input[type="password"] { padding: 10px; font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); border-radius: 7px; }
    .form-tabs { gap: 5px; margin-bottom: 12px; }
    .form-tab { padding: 8px 6px; font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); border-radius: 7px; }
    .login-btn { padding: 10px; font-size: clamp(0.8125rem, 0.8125vw, 0.8125rem); margin-top: 12px; border-radius: 7px; }
    .remember-checkbox { margin: 8px 0; font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); gap: 4px; }
    input[type="checkbox"] { width: 14px; height: 14px; }
    .signup-link { margin-top: 15px; font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); }
    .error-message, .success-message { padding: 7px; font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); margin-bottom: 12px; border-radius: 5px; }
}

@media (max-height: 500px) and (orientation: landscape) {
    body { padding: 10px; }
    .login-container { padding: 30px 25px; }
    .login-header { margin-bottom: 20px; }
    .logo-text { font-size: clamp(1.375rem, 1.375vw, 1.375rem); margin-bottom: 5px; }
    .login-title { font-size: clamp(1.125rem, 1.125vw, 1.125rem); margin-top: 15px; }
    .login-subtitle { font-size: clamp(0.75rem, 0.75vw, 0.75rem); margin-bottom: 15px; }
    .form-group { margin-bottom: 10px; }
    label { font-size: clamp(0.75rem, 0.75vw, 0.75rem); margin-bottom: 4px; }
    input[type="email"],
    input[type="tel"],
    input[type="text"],
    input[type="password"] { padding: 10px; font-size: clamp(0.75rem, 0.75vw, 0.75rem); }
    .form-tabs { margin-bottom: 10px; }
    .login-btn { padding: 10px; font-size: clamp(0.875rem, 0.875vw, 0.875rem); margin-top: 10px; }
    .signup-link { margin-top: 12px; font-size: clamp(0.6875rem, 0.6875vw, 0.6875rem); }
}
</style>
</head>

<body>

<div class="login-container">
    <div class="login-header">
        <div class="logo-text">♡ MYSTIC CHARMS</div>
        <div class="tagline">Designed with quiet charm ♥</div>
    </div>

    <div class="login-title">Welcome</div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm">

        <div class="form-tabs">
            <!-- FIX: Removed inline onclick; events attached in JS to avoid module scope issues -->
            <button type="button" class="form-tab active" id="tabEmail">Email</button>
            <button type="button" class="form-tab" id="tabMobile">Mobile Number</button>
        </div>

        <div id="emailGroup" class="input-group active">
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>
        </div>

        <div id="mobileGroup" class="input-group">
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="mobile" placeholder="09xxxxxxxxx">
            </div>
        </div>

        <div class="form-group">
            <label>Password *</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="Enter your password">
                <span class="password-eye" id="passwordEye">Show</span>
            </div>
        </div>


        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>

    <div class="signup-link">
        Don't have an account? <a href="signup.html">Create one</a>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
    apiKey:            "AIzaSyCumgRBwiwvh0GL1B9DF2OpRDMigVa6y5g",
    authDomain:        "beadsncharmsshop-0.firebaseapp.com",
    projectId:         "beadsncharmsshop-0",
    storageBucket:     "beadsncharmsshop-0.firebasestorage.app",
    messagingSenderId: "803662118321",
    appId:             "1:803662118321:web:0b1dbf0545f7cdfc5bd190",
    measurementId:     "G-TXTWGRXXDK",
    databaseURL:       "https://beadsncharmsshop-0-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let activeTab = 'email';

document.getElementById('tabEmail').addEventListener('click', () => switchTab('email'));
document.getElementById('tabMobile').addEventListener('click', () => switchTab('mobile'));

function switchTab(type) {
    activeTab = type;
    document.querySelectorAll('.form-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.input-group').forEach(g => g.classList.remove('active'));
    document.getElementById(type === 'email' ? 'tabEmail' : 'tabMobile').classList.add('active');
    document.getElementById(`${type}Group`).classList.add('active');

    // Clear the inactive field so old input doesn't interfere
    if (type === 'email') {
        document.getElementById('mobile').value = '';
    } else {
        document.getElementById('email').value = '';
    }
}

document.getElementById('passwordEye').addEventListener('click', () => {
    const input = document.getElementById('password');
    const eye   = document.getElementById('passwordEye');
    if (input.type === 'password') {
        input.type      = 'text';
        eye.textContent = 'Hide';
    } else {
        input.type      = 'password';
        eye.textContent = 'Show';
    }
});

function showError(msg) {
    const el = document.getElementById('errorMessage');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('successMessage').classList.remove('show');
}

function showSuccess(msg) {
    const el = document.getElementById('successMessage');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('errorMessage').classList.remove('show');
}

function clearMessages() {
    document.getElementById('errorMessage').classList.remove('show');
    document.getElementById('successMessage').classList.remove('show');
}


document.getElementById('loginForm').addEventListener('submit', async (event) => {
    // FIX: Prevent default FIRST — stops any native navigation
    event.preventDefault();
    clearMessages();

    const identifier = activeTab === 'email'
        ? document.getElementById('email').value.trim()
        : document.getElementById('mobile').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!identifier || !password) {
        showError('Please fill in all fields.');
        return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
        const snapshot = await get(ref(db, 'users'));

        if (!snapshot.exists()) {
            showError('No users registered yet.');
            btn.disabled = false;
            btn.textContent = 'Sign In';
            return;
        }

        const users = snapshot.val();
        const entry = Object.entries(users).find(([, user]) =>
            (activeTab === 'email'
                ? user.email === identifier
                : (user.mobile === identifier || user.phone === identifier))
            && user.password === password
        );

        if (!entry) {
            showError('Invalid credentials. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Sign In';
            return;
        }

        const [id, user] = entry;

        localStorage.setItem('userLogin', JSON.stringify({
            ...user,
            id,
            userId: id,
            mobile: user.mobile ?? user.phone ?? ''
        }));

        showSuccess('Login successful! Redirecting…');

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 800);

    } catch (error) {
        console.error('Login error:', error);
        showError('Login failed. Please check your connection and try again.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
});
</script>
</body>
</html>
