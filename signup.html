<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Charms - Sign Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: linear-gradient(135deg, #fff1f7 0%, #f8e8f0 100%);
            font-family: "Times New Roman", Arial, sans-serif;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            padding: 50px 40px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: bold;
            color: #3d0026;
            font-family: "Times New Roman";
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 14px;
            color: #d63384;
            font-style: italic;
        }

        .signup-title {
            font-size: 24px;
            font-weight: 600;
            color: #3d0026;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #3d0026;
            margin-bottom: 8px;
            font-family: "Times New Roman";
        }

        input[type="email"],
        input[type="tel"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #3d0026;
            border-radius: 10px;
            font-size: 14px;
            font-family: "Times New Roman";
            transition: 0.3s;
        }

        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #d63384;
            box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.1);
        }

        /* Email field invalid state */

        input[type="email"].email-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        /* Email hint below the input */
        .email-hint {
            font-size: 12px;
            margin-top: 6px;
            min-height: 18px;
            transition: 0.2s;
        }

        .email-hint.hint-invalid {
            color: #dc3545;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            background: #3d0026;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            font-family: "Times New Roman";
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .signup-btn:hover {
            background: #b62a70;
            transform: translateY(-2px);
        }

        .error-message {
            display: none;
            padding: 12px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            display: none;
            padding: 12px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #d63384;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-requirement {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .requirement-met {
            color: #28a745;
        }

        /* ── RESPONSIVE: Tablet (≤ 768px) ── */
        @media (max-width: 768px) {
            body { padding: clamp(24px, 5vw, 30px); }
            
            .signup-container {
                padding: clamp(30px, 5vw, 40px) clamp(20px, 4vw, 30px);
                border-radius: clamp(14px, 3vw, 20px);
            }

            .signup-header { margin-bottom: clamp(28px, 4vw, 36px); }
            .logo-text { font-size: clamp(24px, 5vw, 32px); margin-bottom: clamp(8px, 2vw, 10px); }
            .tagline { font-size: clamp(12px, 2.5vw, 14px); }
            .signup-title { font-size: clamp(20px, 4vw, 24px); margin-top: clamp(22px, 4vw, 30px); margin-bottom: clamp(8px, 1.5vw, 10px); }
            .signup-subtitle { font-size: clamp(12px, 2.5vw, 14px); margin-bottom: clamp(22px, 4vw, 30px); }
            .form-group { margin-bottom: clamp(16px, 3vw, 20px); }
            label { font-size: clamp(13px, 2.5vw, 14px); margin-bottom: clamp(6px, 1.5vw, 8px); }

            input[type="email"],
            input[type="tel"],
            input[type="text"],
            input[type="password"] {
                padding: clamp(11px, 2.5vw, 14px);
                font-size: clamp(13px, 2.5vw, 14px);
                border-radius: clamp(8px, 2vw, 10px);
            }

            .signup-btn {
                padding: clamp(12px, 2.5vw, 14px);
                font-size: clamp(14px, 2.5vw, 16px);
                margin-top: clamp(16px, 3vw, 20px);
            }

            .error-message, .success-message { font-size: clamp(12px, 2.5vw, 14px); padding: clamp(10px, 2vw, 12px); }
            .password-requirement { font-size: clamp(11px, 2vw, 12px); margin-top: clamp(6px, 1.5vw, 8px); }
            .login-link { margin-top: clamp(18px, 3vw, 25px); font-size: clamp(12px, 2.5vw, 14px); }
        }

        /* ── RESPONSIVE: Mobile (≤ 600px) ── */
        @media (max-width: 600px) {
            body { padding: clamp(20px, 4vw, 26px); }

            .signup-container {
                padding: clamp(26px, 4vw, 32px) clamp(18px, 3.5vw, 24px);
                border-radius: clamp(12px, 2.5vw, 16px);
            }

            .signup-header { margin-bottom: clamp(24px, 3.5vw, 32px); }
            .logo-text { font-size: clamp(20px, 5vw, 28px); margin-bottom: clamp(6px, 1.5vw, 8px); }
            .tagline { font-size: clamp(11px, 2.2vw, 13px); }
            .signup-title { font-size: clamp(18px, 4.5vw, 22px); margin-top: clamp(18px, 3.5vw, 26px); margin-bottom: clamp(6px, 1.5vw, 8px); }
            .signup-subtitle { font-size: clamp(11px, 2.2vw, 13px); margin-bottom: clamp(18px, 3.5vw, 26px); }
            .form-group { margin-bottom: clamp(14px, 2.5vw, 18px); }
            label { font-size: clamp(12px, 2.2vw, 13px); margin-bottom: clamp(5px, 1.5vw, 7px); }

            input[type="email"],
            input[type="tel"],
            input[type="text"],
            input[type="password"] {
                padding: clamp(10px, 2.2vw, 12px);
                font-size: clamp(12px, 2.2vw, 13px);
                border-radius: clamp(7px, 1.5vw, 9px);
            }

            .signup-btn {
                padding: clamp(11px, 2.2vw, 13px);
                font-size: clamp(13px, 2.2vw, 15px);
                margin-top: clamp(14px, 2.5vw, 18px);
            }

            .error-message, .success-message { font-size: clamp(11px, 2vw, 13px); padding: clamp(9px, 1.5vw, 11px); }
            .password-requirement { font-size: clamp(10px, 1.8vw, 11px); margin-top: clamp(5px, 1.2vw, 7px); }
            .login-link { margin-top: clamp(16px, 2.5vw, 22px); font-size: clamp(11px, 2vw, 13px); }
        }

        /* ── RESPONSIVE: Small Mobile (≤ 480px) ── */
        @media (max-width: 480px) {
            body { padding: 16px; }

            .signup-container {
                padding: clamp(24px, 4vw, 30px) clamp(16px, 3.5vw, 20px);
                border-radius: 12px;
            }

            .signup-header { margin-bottom: clamp(20px, 3vw, 26px); }
            .logo-text { font-size: clamp(18px, 5vw, 24px); }
            .tagline { font-size: clamp(10px, 2vw, 12px); }
            .signup-title { font-size: clamp(16px, 4vw, 20px); margin-top: clamp(16px, 3vw, 22px); }
            .form-group { margin-bottom: clamp(12px, 2vw, 16px); }
            label { font-size: clamp(11px, 2vw, 12px); }

            input[type="email"],
            input[type="tel"],
            input[type="text"],
            input[type="password"] {
                padding: clamp(10px, 2vw, 11px);
                font-size: clamp(12px, 2vw, 13px);
            }

            .signup-btn {
                padding: clamp(10px, 2vw, 12px);
                font-size: clamp(13px, 2vw, 14px);
                margin-top: clamp(12px, 2vw, 16px);
            }

            .password-requirement { font-size: clamp(9px, 1.8vw, 10px); }
        }

        /* ── RESPONSIVE: Landscape Phone ── */
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 12px; }
            .signup-container { padding: clamp(16px, 2vw, 24px) clamp(12px, 2vw, 18px); }
            .signup-header { margin-bottom: clamp(12px, 2vw, 16px); }
            .logo-text { font-size: clamp(16px, 3vw, 20px); margin-bottom: 4px; }
            .tagline { font-size: clamp(10px, 1.5vw, 12px); }
            .signup-title { font-size: clamp(14px, 2.5vw, 18px); margin-top: clamp(8px, 1.5vw, 12px); margin-bottom: 4px; }
            .signup-subtitle { font-size: clamp(10px, 1.5vw, 12px); margin-bottom: clamp(12px, 2vw, 16px); }
            .form-group { margin-bottom: clamp(10px, 1.5vw, 14px); }
            label { font-size: clamp(10px, 1.5vw, 11px); margin-bottom: 4px; }

            input[type="email"],
            input[type="tel"],
            input[type="text"],
            input[type="password"] { padding: clamp(8px, 1.5vw, 10px); font-size: clamp(11px, 1.5vw, 12px); }

            .signup-btn { padding: clamp(8px, 1.5vw, 10px); font-size: clamp(12px, 1.5vw, 13px); margin-top: 8px; }
            .password-requirement { font-size: clamp(9px, 1.2vw, 10px); margin-top: 3px; }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <div class="logo-text">♡ MYSTIC CHARMS</div>
            <div class="tagline">Designed with quiet charm ♥</div>
        </div>

        <div class="signup-title">Create Account</div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="signupForm">
            <div class="form-group">
                <label for="fullname">Full Name *</label>
                <input type="text" id="fullname" placeholder="Your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
                <div class="email-hint" id="emailHint"></div>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel" id="mobile" placeholder="09xxxxxxxxx" pattern="^09\d{9}$" required>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" placeholder="Create a strong password" required>
                <div class="password-requirement">
                    Password must be at least 6 characters
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="signup-btn">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

const firebaseConfig = {
    apiKey:            "AIzaSyCumgRBwiwvh0GL1B9DF2OpRDMigVa6y5g",
    authDomain:        "beadsncharmsshop-0.firebaseapp.com",
    projectId:         "beadsncharmsshop-0",
    storageBucket:     "beadsncharmsshop-0.firebasestorage.app",
    messagingSenderId: "803662118321",
    appId:             "1:803662118321:web:0b1dbf0545f7cdfc5bd190",
    measurementId:     "G-TXTWGRXXDK",
    databaseURL:       "https://beadsncharmsshop-0-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── EMAIL VALIDATION HELPERS ──────────────────────────────────────

/**
 * Layer 1: Basic email format check (has characters, @, domain, extension).
 */
function isValidEmailFormat(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

/**
 * Layer 2: Gmail-only domain check.
 * Accepts only @gmail.com (case-insensitive).
 */
function isGmailAddress(email) {
    return /^[^\s@]+@gmail\.com$/i.test(email);
}

/**
 * Combined check used on form submit.
 */
function validateEmail(email) {
    if (!isValidEmailFormat(email)) return { valid: false, reason: 'Invalid email format.' };
    if (!isGmailAddress(email))     return { valid: false, reason: 'Only Gmail addresses are accepted (e.g. yourname@gmail.com).' };
    return { valid: true };
}

// ── REAL-TIME EMAIL HINT ──────────────────────────────────────────

const emailInput = document.getElementById('email');
const emailHint  = document.getElementById('emailHint');

emailInput.addEventListener('input', function () {
    const val = this.value.trim();

    this.classList.remove('email-valid', 'email-invalid');
    emailHint.className = 'email-hint';
    emailHint.textContent = '';

    if (val === '') return;

    if (!isValidEmailFormat(val)) {
        this.classList.add('email-invalid');
        emailHint.classList.add('hint-invalid');
        emailHint.textContent = 'Please enter a valid email format.';
        return;
    }

    if (!isGmailAddress(val)) {
        this.classList.add('email-invalid');
        emailHint.classList.add('hint-invalid');
        emailHint.textContent = 'Only @gmail.com addresses are accepted.';
    }
});

// ── MESSAGE HELPERS ───────────────────────────────────────────────

function showError(message) {
    const el = document.getElementById('errorMessage');
    el.textContent = message;
    el.classList.add('show');
}

function showSuccess(message) {
    const el = document.getElementById('successMessage');
    el.textContent = message;
    el.classList.add('show');
}

function clearMessages() {
    document.getElementById('errorMessage').classList.remove('show');
    document.getElementById('successMessage').classList.remove('show');
}

function validateMobile(mobile) {
    return /^09\d{9}$/.test(mobile);
}

// ── FORM SUBMIT ───────────────────────────────────────────────────

document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearMessages();

    const fullname        = document.getElementById('fullname').value.trim();
    const email           = document.getElementById('email').value.trim();
    const mobile          = document.getElementById('mobile').value.trim();
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // VALIDATION
    if (!fullname) return showError('Full name is required.');

    const emailCheck = validateEmail(email);
    if (!emailCheck.valid) return showError(emailCheck.reason);

    if (!validateMobile(mobile)) return showError('Invalid mobile number. Format: 09XXXXXXXXX');
    if (password.length < 6)    return showError('Password must be at least 6 characters.');
    if (password !== confirmPassword) return showError('Passwords do not match.');

    try {
        const dbRef   = ref(db);
        const snapshot = await get(child(dbRef, "users"));

        if (snapshot.exists()) {
            const users = Object.values(snapshot.val());
            const exists = users.some(u =>
                (u.email  && u.email  === email)  ||
                (u.mobile && u.mobile === mobile)
            );
            if (exists) return showError('Email or mobile number is already registered.');
        }

        const userId  = email.replace(/\./g, "_");
        const userData = {
            userId,
            fullname,
            email,
            mobile,
            password,
            role: "user",
            createdAt: new Date().toISOString()
        };

        await set(ref(db, "users/" + userId), userData);

        showSuccess('Account created successfully! Redirecting...');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);

    } catch (error) {
        console.error("Firebase Error:", error);
        showError("Failed to save data: " + error.message);
    }
});
    </script>
</body>
</html>
